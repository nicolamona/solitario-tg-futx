<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10120f"><meta name="description" content="Solitario Klondike clásico para Telegram Mini App."><title>Solitario · FUTX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main class="app-shell"><header class="topbar"><div class="brand-mark" aria-hidden="true">♠</div><div class="brand-copy"><span class="eyebrow">EDICIÓN CLÁSICA</span><h1>Solitario <em>FUTX</em></h1></div><button class="icon-button" id="new-game" aria-label="Nueva partida" title="Nueva partida">↻</button></header>
<section class="stats" aria-label="Estadísticas de partida"><div class="stat"><span class="stat-label">PUNTOS</span><strong id="score">0</strong></div><div class="stat"><span class="stat-label">TIEMPO</span><strong id="timer">00:00</strong></div><div class="stat"><span class="stat-label">MOVIMIENTOS</span><strong id="moves">0</strong></div></section>
<section class="game-panel" aria-label="Tablero de solitario"><div class="top-piles"><div class="stock-area"><button class="pile stock" id="stock" aria-label="Robar carta"></button><span class="pile-caption">MAZO</span></div><div class="waste-area"><div class="pile waste" id="waste" aria-label="Descarte"></div><span class="pile-caption">DESCARTE</span></div><div class="top-spacer"></div><div class="foundation-area" id="foundations"></div></div><div class="tableau" id="tableau"></div><div class="empty-state" id="empty-state" hidden></div></section>
<div class="toolbar"><button class="tool-button" id="undo"><span>↶</span> Deshacer</button><button class="tool-button" id="hint"><span>✧</span> Sugerencia</button><button class="tool-button" id="restart"><span>⟳</span> Reiniciar</button></div><footer class="footer"><span class="footer-dot"></span> KLONDIKE · UN JUEGO DE PACIENCIA <span id="best-label">RÉCORD —</span></footer></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="modal-backdrop" id="win-modal" hidden><section class="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title"><div class="win-icon">✦</div><span class="eyebrow">PARTIDA COMPLETADA</span><h2 id="win-title">¡Excelente partida!</h2><p id="win-summary">Has ordenado las 52 cartas.</p><button class="gold-button" id="play-again">Jugar otra vez</button></section></div><script src="game.js"></script></body></html>
